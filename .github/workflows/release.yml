name: Release desktop apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag
        required: true
        default: v0.1.0

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.result }}
      tag: ${{ steps.tag.outputs.value }}
    steps:
      - id: tag
        env:
          RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: echo "value=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
      - uses: actions/github-script@v7
        id: release
        with:
          script: |
            const tag = '${{ steps.tag.outputs.value }}';
            const existing = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100
            });
            let release = existing.data.find((item) => item.tag_name === tag);
            if (release) {
              release = { data: release };
            } else {
              release = await github.rest.repos.createRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                tag_name: tag,
                name: `Local Caption Tape ${tag}`,
                draft: true,
                prerelease: false,
                generate_release_notes: true
              });
            }
            return release.data.id;

  build:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-15-intel
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ''
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Install Linux packages
        if: startsWith(matrix.platform, 'ubuntu')
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "${{ needs.create-release.outputs.tag }}" --dir release-assets --repo "$GITHUB_REPOSITORY"
      - name: Write checksums and manifest
        env:
          TAG: ${{ needs.create-release.outputs.tag }}
        run: |
          cd release-assets
          find . -type f ! -name SHA256SUMS ! -name latest.json -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          tag = os.environ['TAG']
          repo = os.environ['GITHUB_REPOSITORY']
          files = [str(p.relative_to('.')) for p in Path('.').rglob('*') if p.is_file() and p.name not in {'SHA256SUMS','latest.json'}]
          platforms = {
            'macos': [f for f in files if f.endswith('.dmg')],
            'windows': [f for f in files if f.endswith(('.msi', '.exe'))],
            'linux': [f for f in files if f.endswith(('.AppImage', '.deb'))]
          }
          manifest = {'version': tag, 'platforms': {k: [{'name': Path(f).name, 'url': f'https://github.com/{repo}/releases/download/{tag}/{Path(f).name}'} for f in v] for k,v in platforms.items()}}
          Path('latest.json').write_text(json.dumps(manifest, indent=2) + '\n')
          PY
      - name: Upload manifest
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.create-release.outputs.tag }}
          draft: true
          files: |
            release-assets/SHA256SUMS
            release-assets/latest.json
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "${{ needs.create-release.outputs.tag }}" --draft=false --repo "$GITHUB_REPOSITORY"
