[package]
name = "local-caption-tape"
version = "0.1.1"
description = "Private, searchable meeting captions on your device"
authors = ["Sociobot (Param Factory)"]
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-local-caption-tape"
edition = "2021"

[lib]
name = "local_caption_tape_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
